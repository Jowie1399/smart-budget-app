{% extends "base.html" %}
{% block content %}
<div class="p-4 bg-white rounded shadow-sm">
  <h2>Create a Budget</h2>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Budget Name</label>
      <input class="form-control" name="name" placeholder="eg. Household - June">
    </div>
    <div class="row mb-3">
      <div class="col">
        <label class="form-label">Month</label>
        <input class="form-control" name="month" placeholder="June">
      </div>
      <div class="col">
        <label class="form-label">Year</label>
        <input class="form-control" name="year" placeholder="2025">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Total Monthly Income</label>
      <input class="form-control" name="income" type="number" step="0.01" placeholder="e.g. 15000">
    </div>

    <h5>Expenses (monthly)</h5>
    <div class="row">
      <div class="col"><label>Rent</label><input class="form-control" name="rent" type="number" step="0.01"></div>
      <div class="col"><label>Food</label><input class="form-control" name="food" type="number" step="0.01"></div>
    </div>
    <div class="row mt-2">
      <div class="col"><label>Transport</label><input class="form-control" name="transport" type="number" step="0.01"></div>
      <div class="col"><label>Utilities</label><input class="form-control" name="utilities" type="number" step="0.01"></div>
    </div>
    <div class="row mt-2">
      <div class="col"><label>School</label><input class="form-control" name="school" type="number" step="0.01"></div>
      <div class="col"><label>Health</label><input class="form-control" name="health" type="number" step="0.01"></div>
    </div>
    <div class="mt-3">
      <label>Other</label><input class="form-control" name="other" type="number" step="0.01">
    </div>
    <div class="mt-3">
      <button class="btn btn-success" type="submit">Save Budget</button>
    </div>
  </form>
</div>
{% endblock %}
